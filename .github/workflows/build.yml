name: Build VST3 (Windows)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel --target LiveLoveLaugh_VST3 engine_test Snapshot

      - name: Engine tests
        run: build/Release/engine_test.exe

      - name: Render pedal snapshot
        shell: bash
        run: |
          exe=$(find build -name Snapshot.exe | head -1)
          "$exe"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: LiveLoveLaugh-VST3-Windows
          path: build/LiveLoveLaugh_artefacts/Release/VST3/

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: pedal-snapshot
          path: pedal_*.png

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path "build/LiveLoveLaugh_artefacts/Release/VST3/Live Love Laugh.vst3" -DestinationPath LiveLoveLaugh-Windows.zip

      - name: Publish release (direct download link)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Live Love Laugh v1.0.${{ github.run_number }}
          body: "Download LiveLoveLaugh-Windows.zip, pak uit en zet de map 'Live Love Laugh.vst3' in C:\\Program Files\\Common Files\\VST3"
          files: LiveLoveLaugh-Windows.zip
          make_latest: true

      - name: Push snapshot to 'snapshots' branch
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir snap && cp pedal_*.png snap/ && cd snap
          git init -q -b snapshots
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "UI snapshot ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" snapshots
